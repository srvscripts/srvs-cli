name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # current Go: older linkers omit LC_UUID, which macOS 15+ refuses to load
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set +e
          go test -count=1 -json ./... > test.json; rc=$?
          # Failing tests' messages as one public annotation (job logs need a login, annotations do not).
          msg=$(jq -r 'select(.Action=="output") | .Output' test.json | grep -vE '^(=== (RUN|PAUSE|CONT|NAME)|--- (PASS|SKIP)|PASS$|ok |coverage:)' | grep -v '^\s*$' | head -60 | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          [ -n "$msg" ] && echo "::error title=go test failures (${{ runner.os }})::$msg"
          jq -r 'select(.Action=="output") | .Output' test.json | tr -d '\r' | grep -vE '^=== (RUN|PAUSE|CONT)' | tail -60
          exit $rc
      - name: build
        run: go build -o srvs-test ./cmd/srvs
      - name: smoke test (live network)
        if: runner.os != 'Windows'
        run: |
          ./srvs-test version
          code=0; ./srvs-test ssl github.com --warn-days 3 || code=$?; echo "ssl exit $code"; test "$code" -le 1
          ./srvs-test dns github.com MX
          code=0; ./srvs-test mail github.com --json > /dev/null || code=$?; echo "mail exit $code"; test "$code" -le 2
