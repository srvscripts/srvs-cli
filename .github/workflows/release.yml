name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable   # current Go: older linkers omit LC_UUID, which macOS 15+ refuses to load
      - run: go vet ./... && go test -count=1 ./...
      - name: build archives
        run: |
          set -eu
          V="${GITHUB_REF_NAME}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"; name="srvs_${V#v}_${os}_${arch}"; bin=srvs; [ "$os" = windows ] && bin=srvs.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/srvscripts/srvs-cli/internal/report.Version=$V" \
              -o "build/$name/$bin" ./cmd/srvs
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../dist/$name.zip" "$name"); else tar -C build -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "srvs $GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"
